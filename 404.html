<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Restricted | منصة معيار</title>
<style>
  :root{--primary:#364C63; --heading:#1C2733; --line:#E3E8EE}
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center;
    background:#F4F6F8; color:var(--heading); padding:24px;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
  }
  .card{
    background:#FFFFFF; border:1.5px solid var(--primary); border-radius:16px;
    max-width:520px; width:100%; padding:38px 30px; text-align:center;
    box-shadow:0 10px 30px rgba(28,39,51,.08);
  }
  .brand{font-size:14px; font-weight:700; color:var(--primary); letter-spacing:.3px; margin-bottom:22px}
  h1{margin:0 0 10px; font-size:26px; color:var(--heading)}
  p{margin:0; font-size:14.5px; line-height:2; color:#44515E}
  .sep{border:0; border-top:1px solid var(--line); margin:22px auto; width:64px}
  .en{direction:ltr}
  .en h2{margin:0 0 10px; font-size:22px; color:var(--heading)}
</style>
</head>
<body>
  <main class="card">
    <div class="brand">منصة معيار | Meyar Platform</div>
    <h1>الوصول مقيد</h1>
    <p>المنصة متوقفة مؤقتاً، والوصول إلى جميع صفحاتها مقيد في الوقت الحالي.</p>
    <hr class="sep">
    <div class="en">
      <h2>Restricted</h2>
      <p>This platform is temporarily unavailable. Access to all pages is currently restricted.</p>
    </div>
  </main>
</body>
</html>
