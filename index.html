:root{
  --primary:#364C63; --primary-hover:#2B3D4F; --primary-soft:#E0E4E9; --primary-faint:#F7F9FB;
  --heading:#1C2733; --heading-soft:#2A3846; --accent:#243342;
  --ink:#161C24; --ink-muted:#4C5765;
  --paper:#EDF1F5; --surface:#FFFFFF; --border:#DFE5EC; --border-strong:#7B8794;
  --focus:#364C63; --gold:#F0AE14;
  --btn-ink:#FFFFFF; --btn-ink-16:rgba(255,255,255,.16); --btn-ink-34:rgba(255,255,255,.34);
  --radius:18px;
  --shadow-1:0 1px 2px rgba(22,28,36,.05), 0 6px 18px rgba(22,28,36,.06);
  --shadow-2:0 10px 26px rgba(22,28,36,.14);
  --topbar-h:78px;
}
*{box-sizing:border-box}
html,body{margin:0; padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:'Tajawal','Noto Sans Arabic','Segoe UI',Tahoma,sans-serif;
  font-size:15px; line-height:1.85; -webkit-font-smoothing:antialiased;
  min-height:100vh; display:flex; flex-direction:column;
}
a{color:var(--accent)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px}

/* ---------- top bar (مطابق لبقية الصفحات) ---------- */
.topbar{
  height:var(--topbar-h); background:var(--primary); color:var(--btn-ink);
  display:flex; align-items:center; gap:18px; padding:0 22px;
  position:sticky; top:0; z-index:40; box-shadow:var(--shadow-2);
}
.brand-mark{flex:0 0 auto; display:flex; align-items:center}
.brand{display:flex; flex-direction:column; justify-content:center; min-width:0}
.brand b{font-size:19px; font-weight:700; letter-spacing:-.1px; line-height:1.4; white-space:nowrap}
.brand span{font-size:12px; opacity:.82; font-weight:400; line-height:1.4; white-space:nowrap}
.topbar .spacer{flex:1}
.lang-btn{
  flex:0 0 auto; background:var(--btn-ink-16); border:1px solid var(--btn-ink-34);
  color:var(--btn-ink); border-radius:10px; min-width:44px; padding:7px 13px; font-size:13.5px;
  font-weight:700; cursor:pointer; transition:.15s; letter-spacing:.3px;
}
.lang-btn:hover{background:var(--btn-ink); color:var(--primary); border-color:var(--btn-ink)}

/* ---------- المحتوى ---------- */
.wrap{flex:1; width:100%; max-width:1080px; margin:0 auto; padding:60px 26px 40px}
.hero{text-align:center; margin-bottom:52px}
.hero .mk{display:inline-flex; margin-bottom:20px}
.hero h1{
  font-size:40px; font-weight:700; color:var(--heading);
  margin:0 0 10px; letter-spacing:-.6px; line-height:1.35;
}
.hero p{
  margin:0 auto; max-width:62ch; font-size:16.5px; font-weight:400;
  color:var(--ink-muted); line-height:1.9;
}
.rule{width:96px; height:4px; background:var(--gold); border-radius:2px; margin:24px auto 0}

/* ---------- البوّابتان ---------- */
.doors{display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:24px}
.door{
  display:flex; flex-direction:column; text-decoration:none; color:inherit;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:32px 30px 26px; box-shadow:var(--shadow-1);
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  position:relative; overflow:hidden;
}
.door::before{
  content:""; position:absolute; inset-inline:0; top:0; height:4px; background:var(--primary);
}
.door:hover, .door:focus-visible{
  transform:translateY(-3px); box-shadow:var(--shadow-2); border-color:var(--border-strong);
}
.door .fam{
  font-size:12.5px; font-weight:700; letter-spacing:.6px; color:var(--primary);
  background:var(--primary-soft); border-radius:999px; padding:4px 13px;
  align-self:flex-start; margin-bottom:16px; direction:ltr;
}
.door h2{font-size:26px; font-weight:700; color:var(--heading); margin:0 0 8px; letter-spacing:-.3px}
.door .desc{font-size:14.5px; color:var(--ink-muted); line-height:1.9; margin:0 0 20px; flex:1}
.door .stats{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px}
.door .stats:empty{display:none}
.chip{
  background:var(--primary-faint); border:1px solid var(--border);
  border-radius:999px; padding:4px 13px; font-size:12.5px; color:var(--ink-muted); white-space:nowrap;
}
.chip b{font-weight:700; color:var(--heading)}
.door .go{
  display:inline-flex; align-items:center; gap:8px; align-self:flex-start; margin-block-start:auto;
  background:var(--primary); color:#fff; border-radius:12px;
  padding:10px 20px; font-size:14.5px; font-weight:700; transition:background .15s;
}
.door:hover .go{background:var(--primary-hover)}
.door .go .arrow{font-size:16px; line-height:1}

/* بطاقة غير مفعّلة — القطاع العام قريباً */
.door.soon{cursor:default}
.door.soon::before{background:var(--border-strong)}
.door.soon:hover{transform:none; box-shadow:var(--shadow-1); border-color:var(--border)}
.door.soon .go,
.door.soon:hover .go{background:var(--primary-faint); color:var(--ink-muted); font-weight:500}

/* ---------- التذييل ---------- */
.foot{
  border-top:1px solid var(--border); margin-top:52px; padding:22px 26px 34px;
  text-align:center; font-size:13px; color:var(--ink-muted); line-height:1.9;
}
.foot a{color:var(--accent)}
.foot .mail{display:block; margin-top:12px}
.foot .mail a{
  color:var(--primary); font-weight:500; text-decoration:none;
  border-bottom:1px solid var(--gold); padding-bottom:2px;
}
.foot .mail a:hover{color:var(--gold)}
.foot .copy{display:block; margin-top:10px; font-size:12.5px}

@media (max-width:760px){
  :root{--topbar-h:66px}
  .wrap{padding:38px 18px 30px}
  .hero h1{font-size:30px}
  .hero p{font-size:15px}
  .brand span{display:none}
  .door{padding:26px 22px 22px}
  .door h2{font-size:22px}
}

      <span class="go"><span id="privGo"></span><span class="arrow" id="privArrow"></span></span>

      <span class="go"><span id="pubGo"></span></span>
    </div>
  </div>
</div>

<script>
(function () {
  var MARK = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="{S}" height="{S}" style="color:{C}" role="img" aria-label="منصة معيار">'
    + '<path fill-rule="evenodd" fill="currentColor" d="M 25.5 20.75 A 10.75 10.75 0 0 1 47 20.75 V 26 A 10 10 0 0 1 37 36 H 25.5 V 50.8 L 17 54.4 V 39 A 8.5 8.5 0 0 1 25.5 30.5 Z M 34.4 19.5 a 3.3 3.3 0 0 1 6.6 0 v 7 a 3.3 3.3 0 0 1 -6.6 0 Z"/>'
    + '<rect x="34.4" y="16.2" width="6.6" height="13.6" rx="3.3" fill="#F0AE14"/></svg>';
  function mark(size, color) { return MARK.split('{S}').join(size).split('{C}').join(color); }

  var UI = {
    ar: {
      brandTitle: 'منصة معيار', brandSub: 'مرجع المحاسب الشامل',
      langBtn: 'EN', langTitle: 'English',
      h1: 'منصة معيار',
      p: 'مرجع تعليمي لمعايير المحاسبة.',
      privT: 'القطاع الخاص', privD: 'المعايير الدولية للتقرير المالي IFRS والمعايير المحاسبية الدولية IAS.',
      pubT: 'القطاع العام',
      go: 'ادخل', arrow: '←', soon: 'قريباً',
      foot: 'محتوى تعليمي من إعداد وصياغة مستقلة، مُسنَد إلى المصادر الرسمية للجهات المُصدِرة.<span class="mail"><a href="mailto:info@meyarplatform.com">info@meyarplatform.com</a></span><span class="copy">© 2026 منصة معيار</span>'
    },
    en: {
      brandTitle: 'Meyar', brandSub: "The Accountant's Reference",
      langBtn: 'ع', langTitle: 'العربية',
      h1: 'Meyar',
      p: 'An educational reference for accounting standards.',
      privT: 'Private Sector', privD: 'IFRS Accounting Standards and IAS.',
      pubT: 'Public Sector',
      go: 'Enter', arrow: '→', soon: 'Coming soon',
      foot: 'Educational content, independently prepared and worded, referenced to the issuing bodies’ official sources.<span class="mail"><a href="mailto:info@meyarplatform.com">info@meyarplatform.com</a></span><span class="copy">© 2026 Meyar Platform</span>'
    }
  };

  /* أضيفي/عدّلي الأرقام هنا فقط */
  var STATS = {
    ar: { priv: ['<b>43</b> معياراً', '<b>40</b> ساري', '<b>3</b> قادم'], pub: [] },
    en: { priv: ['<b>43</b> standards', '<b>40</b> effective', '<b>3</b> upcoming'], pub: [] }
  };

  var LANG = (new URLSearchParams(location.search)).get('lang') === 'en' ? 'en' : 'ar';
  var set = function (id, v) { var e = document.getElementById(id); if (e) e.innerHTML = v; };

  function render() {
    var u = UI[LANG], s = STATS[LANG];
    document.documentElement.lang = LANG === 'en' ? 'en' : 'ar';
    document.documentElement.dir = LANG === 'en' ? 'ltr' : 'rtl';
    document.title = LANG === 'en'
      ? "Meyar — The Accountant's Reference"
      : 'منصة معيار — مرجع المحاسب الشامل';

    set('brandMark', mark(34, '#FFFFFF'));
    set('heroMark', mark(84, '#364C63'));
    set('brandTitle', u.brandTitle); set('brandSub', u.brandSub);
    set('heroH1', u.h1); set('heroP', u.p);
    set('privT', u.privT); set('privD', u.privD);
    set('pubT', u.pubT);
    set('privGo', u.go);  set('privArrow', u.arrow);
    set('pubGo', u.soon);
    set('foot', u.foot);

    var chips = function (arr) {
      return arr.map(function (c) { return '<span class="chip">' + c + '</span>'; }).join('');
    };
    set('privS', chips(s.priv));
    set('pubS', chips(s.pub));

    var q = LANG === 'en' ? '?lang=en' : '';
    document.getElementById('doorPrivate').href = 'private-sector.html' + q;

    var lb = document.getElementById('langBtn');
    lb.textContent = u.langBtn; lb.title = u.langTitle;
  }

  document.getElementById('langBtn').addEventListener('click', function () {
    LANG = (LANG === 'ar') ? 'en' : 'ar';
    var url = location.pathname + (LANG === 'en' ? '?lang=en' : '');
    history.replaceState(null, '', url);
    render();
  });

  render();
})();
</script>
